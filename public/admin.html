<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetMaxx Admin — Withdrawals</title>
<link rel="stylesheet" href="style.css">
<style>body{padding:20px}main{padding:0;max-width:1100px}.bar{display:flex;gap:10px;margin-bottom:16px}.bar input{max-width:360px}td code{font-size:12px;word-break:break-all}td button{padding:5px 10px;font-size:12px}</style>
</head>
<body>
<main>
  <h1>Withdrawal review</h1>
  <p class="muted">Send each approved payout from your own wallet first, then paste the transaction hash and approve. Rejecting refunds the player's balance.</p>
  <div class="bar"><input id="tok" type="password" placeholder="ADMIN_TOKEN"><button id="load">Load</button></div>
  <div class="err" id="err"></div>
  <table><thead><tr><th>When</th><th>Player</th><th>Coin</th><th>USD</th><th>Address</th><th>Wagered / Deposited</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const call = async (p, body) => {
  const r = await fetch('/api/admin/' + p, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'x-admin-token': $('#tok').value }, body: body && JSON.stringify(body) });
  const d = await r.json(); if (!r.ok) throw new Error(d.error); return d;
};
async function load() {
  $('#err').textContent = '';
  try {
    const l = await call('withdrawals');
    $('#rows').innerHTML = l.map((w) => `<tr><td>${new Date(w.createdAt).toLocaleString()}</td><td>${esc(w.username)}</td><td>${esc(w.coin)}</td><td>$${(w.usd / 100).toFixed(2)}</td><td><code>${esc(w.address)}</code></td><td>$${((w.wagered || 0) / 100).toFixed(2)} / $${((w.deposited || 0) / 100).toFixed(2)}</td><td>${esc(w.status)}${w.txid ? '<br><code>' + esc(w.txid) + '</code>' : ''}</td><td>${w.status === 'pending' ? `<button data-a="approve" data-id="${w.id}">Approve</button> <button class="ghost" data-a="reject" data-id="${w.id}">Reject</button>` : ''}</td></tr>`).join('') || '<tr><td colspan=8 class="muted">No withdrawals</td></tr>';
  } catch (e) { $('#err').textContent = e.message; }
}
$('#load').onclick = load;
$('#rows').onclick = async (e) => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const body = { id: b.dataset.id, action: b.dataset.a };
  if (body.action === 'approve') { body.txid = prompt('Transaction hash of the payout you sent:'); if (!body.txid) return; }
  else { body.reason = prompt('Reason (shown to the player):') || ''; }
  try { await call('withdrawals/decide', body); load(); } catch (err) { $('#err').textContent = err.message; }
};
</script>
</body>
</html>
